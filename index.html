<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EventBot v5.0 - Dashboard</title>
<meta name="description" content="Dashboard de gerenciamento de eventos musicais com integração ao Google Calendar"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231E201E'/><text y='23' x='5' font-size='20'>♪</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&family=Google+Sans+Display:wght@300;400;500;700&family=Google+Sans+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<!-- Scripts -->
<script src="extraction.js?v=20260820"></script>
<script src="extraction_config.js?v=20260820"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="config.js?v=20260820"></script>
<script src="db.js?v=20260820"></script>

<style>
/* ── DESIGN TOKENS ── */
:root {
  --black:  #0F0E0E;
  --dark:   #1A1C1A;
  --dark2:  #222422;
  --brown:  #A27B5C;
  --sand:   #DCD7C9;
  --sage:   #697565;
  --bl:     #C49A72;
  --sdk:    #B8B2A5;
  --r:      14px;
  --rsm:    8px;
  
  --light-bg: #F8F7F4;
  --light-dark: #FFFFFF;
  --light-dark2: #F2EFE9;
  --light-text: #1A1C1A;
  --light-muted: #8B9390;
  --light-border: rgba(162,123,92,.2);
}

body.theme-ocean {
  --black:  #0A1628;
  --dark:   #0F2440;
  --dark2:  #1a3a52;
  --brown:  #0E90CB;
  --sand:   #B3D9F2;
  --sage:   #5B9FBE;
  --bl:     #40B0E0;
  --sdk:    #6BA8D0;
}

body.theme-forest {
  --black:  #0F1B0F;
  --dark:   #1A2D1A;
  --dark2:  #254125;
  --brown:  #2D9D44;
  --sand:   #C8E6C9;
  --sage:   #66BB6A;
  --bl:     #81C784;
  --sdk:    #A5D6A7;
}

body.theme-sunset {
  --black:  #2A1810;
  --dark:   #3E2723;
  --dark2:  #5D4037;
  --brown:  #FF6E40;
  --sand:   #FFE0B2;
  --sage:   #E8956F;
  --bl:     #FF8A65;
  --sdk:    #FFAB91;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  background: var(--black);
  color: var(--sand);
  font-family: 'Google Sans', sans-serif;
  font-size: 14px;
}

body.light-mode {
  background: var(--light-bg);
  color: var(--light-text);
}

body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 40% at 0% 0%, rgba(162,123,92,.06) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 100% 100%, rgba(105,117,101,.05) 0%, transparent 70%);
}

/* ── LAYOUT ── */
.app {
  position: relative; z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 100%;
  margin: 0 auto;
  overflow: hidden;
}

/* ── TOPBAR ── */
.topbar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  padding: 0 24px;
  height: 62px;
  border-bottom: 1px solid rgba(162,123,92,.15);
  background: rgba(22,24,22,.97);
  backdrop-filter: blur(20px);
  flex-shrink: 0;
}

body.light-mode .topbar {
  background: rgba(255,255,255,.95);
  border-bottom-color: var(--light-border);
}

.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--brown), #7a5c3e);
  border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-size: 14px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(162,123,92,.25);
}
.logo-text {
  font-family: 'Google Sans Display', sans-serif;
  font-size: 16px; font-weight: 700; letter-spacing: -.4px; color: var(--sand);
}

.nav-tabs {
  display: flex; align-items: center; justify-content: center;
  height: 100%; gap: 4px;
}

.nav-tab {
  height: 100%; padding: 0 20px;
  background: transparent; border: none; border-bottom: 2px solid transparent;
  color: var(--sage); font-family: 'Google Sans', sans-serif;
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all .18s; display: flex; align-items: center; gap: 7px;
}

.nav-tab:hover { color: var(--sand); }
.nav-tab.active { color: var(--sand); border-bottom-color: var(--brown); font-weight: 600; }

body.light-mode .nav-tab { color: var(--light-muted); }
body.light-mode .nav-tab:hover { color: var(--light-text); }
body.light-mode .nav-tab.active { color: var(--light-text); }

.topbar-right {
  display: flex; align-items: center; gap: 8px; justify-content: flex-end;
}

.status-pill {
  display: flex; align-items: center; gap: 6px;
  background: rgba(162,123,92,.07); border: 1px solid rgba(162,123,92,.15);
  padding: 4px 11px; border-radius: 20px; font-size: 11.5px; color: var(--sage);
}

.sdot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--sage); flex-shrink: 0; animation: pulse 2.5s ease infinite;
}
.sdot.on { background: #6fcf7a; animation: none; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

.btn-top {
  background: transparent; border: 1px solid rgba(162,123,92,.18);
  color: var(--sdk); padding: 5px 13px; border-radius: 20px;
  font-family: 'Google Sans', sans-serif; font-size: 12px; cursor: pointer; transition: all .18s;
}
.btn-top:hover { background: rgba(162,123,92,.1); color: var(--sand); border-color: rgba(162,123,92,.35); }

/* ── MAIN CONTENT ── */
.main-content {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── HOME DASHBOARD ── */
.home-dashboard {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px;
  gap: 20px;
}

.home-dashboard::-webkit-scrollbar { width: 6px; }
.home-dashboard::-webkit-scrollbar-thumb { background: rgba(162,123,92,.2); border-radius: 3px; }

/* ── SECTIONS ── */
.dashboard-section {
  animation: fadeIn .3s ease;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.section-title {
  font-family: 'Google Sans Display', sans-serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--sand);
}

.section-icon {
  font-size: 20px;
  opacity: .7;
}

/* ── STATS GRID ── */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 8px;
}

.stat-card {
  background: rgba(162,123,92,.07);
  border: 1px solid rgba(162,123,92,.12);
  border-radius: var(--rsm);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.stat-value {
  font-family: 'Google Sans Display', sans-serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--bl);
}

.stat-label {
  font-size: 12px;
  color: var(--sage);
  font-weight: 500;
}

/* ── EVENTS GRID ── */
.events-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
  margin-bottom: 12px;
}

/* ── EVENT CARD ── */
.event-card {
  background: var(--dark2);
  border: 1px solid rgba(162,123,92,.15);
  border-radius: var(--r);
  overflow: hidden;
  cursor: pointer;
  transition: all .2s;
  display: flex;
  flex-direction: column;
  height: fit-content;
}

.event-card:hover {
  border-color: rgba(162,123,92,.35);
  box-shadow: 0 8px 24px rgba(162,123,92,.15);
  transform: translateY(-2px);
}

.event-card-header {
  padding: 16px;
  border-bottom: 1px solid rgba(162,123,92,.1);
  position: relative;
  overflow: hidden;
}

.event-card-header::before {
  content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
  background: linear-gradient(to bottom, var(--brown), var(--sage));
}

.event-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--sand);
  margin-bottom: 8px;
  margin-left: 8px;
  line-height: 1.3;
}

.event-date {
  font-size: 12px;
  background: rgba(162,123,92,.14);
  border: 1px solid rgba(162,123,92,.28);
  color: var(--bl);
  padding: 4px 10px;
  border-radius: 12px;
  display: inline-block;
  margin-left: 8px;
}

.event-card-body {
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.event-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
}

.event-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--sage);
  text-transform: uppercase;
  letter-spacing: .5px;
  min-width: 60px;
  flex-shrink: 0;
  margin-top: 2px;
}

.event-value {
  color: var(--sand);
  flex: 1;
  line-height: 1.4;
}

.time-slots {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.time-slot {
  background: rgba(162,123,92,.1);
  border: 1px solid rgba(162,123,92,.2);
  color: var(--sdk);
  padding: 3px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-family: 'Google Sans Mono', monospace;
}

.event-card-footer {
  padding: 12px 16px;
  border-top: 1px solid rgba(162,123,92,.1);
  display: flex;
  gap: 8px;
}

.btn-small {
  flex: 1;
  padding: 7px 12px;
  background: rgba(162,123,92,.1);
  border: 1px solid rgba(162,123,92,.2);
  color: var(--sand);
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
}

.btn-small:hover {
  background: rgba(162,123,92,.2);
  border-color: rgba(162,123,92,.35);
}

/* ── VENUES GRID ── */
.venues-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

.venue-card {
  background: var(--dark2);
  border: 1px solid rgba(162,123,92,.15);
  border-radius: var(--rsm);
  padding: 16px;
  transition: all .2s;
}

.venue-card:hover {
  border-color: rgba(162,123,92,.35);
  box-shadow: 0 4px 12px rgba(162,123,92,.1);
}

.venue-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--sand);
  margin-bottom: 8px;
}

.venue-address {
  font-size: 12px;
  color: var(--sage);
  line-height: 1.5;
}

/* ── ARTISTS GRID ── */
.artists-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}

.artist-card {
  background: var(--dark2);
  border: 1px solid rgba(162,123,92,.15);
  border-radius: var(--rsm);
  padding: 16px;
  text-align: center;
  transition: all .2s;
}

.artist-card:hover {
  border-color: rgba(162,123,92,.35);
  background: rgba(162,123,92,.08);
}

.artist-icon {
  font-size: 32px;
  margin-bottom: 10px;
}

.artist-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--sand);
  margin-bottom: 4px;
}

.artist-count {
  font-size: 11px;
  color: var(--sage);
}

/* ── FLOATING CHATBOT ── */
.chatbot-floating {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 380px;
  height: 600px;
  max-height: calc(100vh - 40px);
  display: flex;
  flex-direction: column;
  background: var(--dark);
  border: 1px solid rgba(162,123,92,.2);
  border-radius: var(--r);
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
  z-index: 999;
  overflow: hidden;
  animation: slideUp .3s ease;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(20px) scale(.95);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.chat-header {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(162,123,92,.15);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(135deg, rgba(162,123,92,.1), rgba(105,117,101,.05));
}

.chat-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--sand);
  display: flex;
  align-items: center;
  gap: 8px;
}

.chat-close-btn {
  background: transparent;
  border: none;
  color: var(--sage);
  font-size: 18px;
  cursor: pointer;
  transition: all .15s;
}

.chat-close-btn:hover {
  color: var(--sand);
}

/* ── CHAT MESSAGES ── */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}

.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-thumb { background: rgba(162,123,92,.2); border-radius: 2px; }

.chat-message {
  display: flex;
  gap: 8px;
  animation: msgSlide .2s ease;
}

@keyframes msgSlide {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.chat-message.user {
  flex-direction: row-reverse;
}

.chat-avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
}

.chat-message.bot .chat-avatar {
  background: linear-gradient(135deg, var(--brown), #7a5c3e);
  color: var(--sand);
}

.chat-message.user .chat-avatar {
  background: rgba(105,117,101,.25);
  color: var(--sand);
}

.chat-bubble {
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.5;
  max-width: 75%;
  word-break: break-word;
}

.chat-message.bot .chat-bubble {
  background: rgba(162,123,92,.1);
  color: var(--sand);
  border: 1px solid rgba(162,123,92,.2);
}

.chat-message.user .chat-bubble {
  background: rgba(105,117,101,.2);
  color: var(--sand);
  border: 1px solid rgba(105,117,101,.3);
}

/* ── CHAT INPUT ── */
.chat-input-area {
  padding: 12px;
  border-top: 1px solid rgba(162,123,92,.15);
  display: flex;
  gap: 8px;
}

.chat-input {
  flex: 1;
  background: rgba(162,123,92,.05);
  border: 1px solid rgba(162,123,92,.15);
  color: var(--sand);
  padding: 8px 12px;
  border-radius: 6px;
  font-family: 'Google Sans', sans-serif;
  font-size: 12px;
  outline: none;
  transition: all .15s;
}

.chat-input:focus {
  border-color: rgba(162,123,92,.35);
  background: rgba(162,123,92,.08);
}

.chat-input::placeholder {
  color: rgba(162,123,92,.4);
}

.btn-send {
  background: linear-gradient(135deg, var(--brown), #7a5c3e);
  border: none;
  color: var(--sand);
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
  font-weight: 500;
}

.btn-send:hover {
  box-shadow: 0 4px 12px rgba(162,123,92,.3);
  transform: translateY(-1px);
}

/* ── RESIZE HANDLE ── */
.resize-handle {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 20px;
  height: 20px;
  cursor: nwse-resize;
  background: linear-gradient(135deg, transparent 50%, var(--brown) 50%);
  border-bottom-right-radius: var(--r);
  opacity: .5;
  transition: opacity .2s;
}

.resize-handle:hover {
  opacity: 1;
}

/* ── FILTERS BAR ── */
.filters-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 8px 16px;
  background: rgba(162,123,92,.1);
  border: 1px solid rgba(162,123,92,.2);
  color: var(--sand);
  border-radius: 20px;
  font-family: 'Google Sans', sans-serif;
  font-size: 12px;
  cursor: pointer;
  transition: all .2s;
}

.filter-btn:hover {
  background: rgba(162,123,92,.2);
  border-color: rgba(162,123,92,.35);
  transform: translateY(-1px);
}

.filter-btn.active {
  background: linear-gradient(135deg, var(--brown), #7a5c3e);
  border-color: var(--brown);
  color: var(--sand);
  font-weight: 600;
}

.filter-btn.reset {
  background: rgba(210,70,70,.1);
  border-color: rgba(210,70,70,.3);
  color: #c07070;
}

.filter-btn.reset:hover {
  background: rgba(210,70,70,.2);
  border-color: rgba(210,70,70,.5);
}

/* ── HIDDEN SECTIONS ── */
.hidden { display: none !important; }

/* ── MODALS ── */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  animation: modalFade .2s ease;
}

@keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }

.modal.hidden { display: none !important; }

.modal-content {
  background: var(--dark);
  border: 1px solid rgba(162,123,92,.2);
  border-radius: var(--r);
  padding: 24px;
  max-width: 500px;
  max-height: 80vh;
  overflow-y: auto;
  animation: modalSlide .3s ease;
}

@keyframes modalSlide {
  from {
    opacity: 0;
    transform: scale(.95);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* ── RESPONSIVE ── */
@media (max-width: 1024px) {
  .events-grid {
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  
  .chatbot-floating {
    width: 100%;
    height: 100%;
    bottom: 0;
    right: 0;
    border-radius: 0;
  }
}

@media (max-width: 768px) {
  .topbar {
    grid-template-columns: auto 1fr;
  }
  
  .nav-tabs {
    display: none;
  }
  
  .home-dashboard {
    padding: 16px;
    gap: 16px;
  }
  
  .stats-grid {
    grid-template-columns: 1fr 1fr;
  }
  
  .events-grid {
    grid-template-columns: 1fr;
  }
  
  .venues-grid {
    grid-template-columns: 1fr;
  }
  
  .artists-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

</style>
</head>

<body>
<div class="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="logo">
      <div class="logo-mark">♪</div>
      <div class="logo-text">Event<em>Bot</em></div>
    </div>
    
    <div class="nav-tabs" id="nav-tabs">
      <button class="nav-tab active" data-tab="home">Home</button>
      <button class="nav-tab" data-tab="venues">Locais</button>
      <button class="nav-tab" data-tab="artists">Artistas</button>
    </div>
    
    <div class="topbar-right">
      <div class="status-pill">
        <div class="sdot on"></div>
        <span id="status-text">Pronto</span>
      </div>
      <button class="btn-top" id="btn-google-login" onclick="handleLoginClick()">🔐 Login Google</button>
      <button class="btn-top" id="btn-settings">⚙️ Config</button>
      <button class="btn-top" id="btn-theme">☀</button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <!-- HOME DASHBOARD -->
    <div class="home-dashboard" id="home-tab">
      <!-- STATS SECTION -->
      <div class="dashboard-section">
        <div class="section-header">
          <span class="section-icon">📊</span>
          <span class="section-title">Resumo</span>
        </div>
        <div class="stats-grid" id="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="stat-events">0</div>
            <div class="stat-label">Eventos</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-venues">0</div>
            <div class="stat-label">Locais</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-artists">0</div>
            <div class="stat-label">Artistas</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-next">-</div>
            <div class="stat-label">Próximo</div>
          </div>
        </div>
      </div>

      <!-- EVENTS SECTION -->
      <div class="dashboard-section">
        <div class="section-header">
          <span class="section-icon">🎵</span>
          <span class="section-title">Eventos Cadastrados</span>
        </div>

        </div>
        <div class="venues-grid" id="venues-grid">
